# Gitleaks-configuratie: de standaardregels plus een uitzondering voor testbestanden. Testbestanden mogen
# nagebootste sleutels bevatten (nep-API-sleutels), geen echte geheimen.
# Een echt geheim in code buiten tests blijft dus gevonden worden.
title = "Avanta Reizen"

[extend]
useDefault = true

[allowlist]
description = "Nagebootste sleutels in tests"
paths = [
  '''(^|/)test/.*''',
  '''(^|/)tests/.*''',
]
