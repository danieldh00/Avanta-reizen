name: Develop bijwerken

# Houdt de integratiebranch `develop` gelijk met `main`: main wordt in develop gemerged, elke nacht, na elke geslaagde
# release en op afroep. Zo loopt develop nooit achter op versienummer, app/CHANGELOG.md en bugfixes, en blijft de PR
# van develop naar main per module klein (zie docs/VUE-OMBOUW.md).
# - Bestaat develop nog niet, dan doet deze workflow niets.
# - Altijd een eigen mergecommit (--no-ff): een releasecommit heeft [skip ci] in zijn bericht en zou als laatste commit
#   op develop de staging-build overslaan.
# - Een merge met conflicten wordt niet geforceerd: de run faalt en er komt één issue met het label `develop-sync`.
#   Los het conflict op in een gewone branch met een PR naar develop.
# - De push gaat met RELEASE_PUSH_TOKEN (bypass in de ruleset van develop, net als release.yml op main).

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: develop-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: main naar develop
    # Na een mislukte release is er niets nieuws om samen te voegen.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Controleer of het token voor de push is ingesteld
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "::error::Repository-secret RELEASE_PUSH_TOKEN ontbreekt; develop kan niet worden bijgewerkt."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
      - name: main in develop mergen
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "::notice::Er is nog geen branch develop; niets te doen."
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin main develop
            git checkout -B develop origin/develop
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "develop bevat main al."
              exit 0
            fi
            if ! git merge --no-ff --no-edit -m "main naar develop" origin/main; then
              git merge --abort || true
              gh label create develop-sync --color d93f0b --description "main kon niet in develop worden gemerged" --force
              open=$(gh issue list --label develop-sync --state open --json number --jq 'length')
              if [ "$open" = "0" ]; then
                gh issue create --label develop-sync --title "main naar develop: merge-conflict" \
                  --body "De automatische merge van main in develop gaf een conflict ($RUN_URL). Los het op in een eigen branch vanaf develop (git merge origin/main), met een PR naar develop. Sluit dit issue daarna."
              fi
              echo "::error::Merge-conflict tussen main en develop; zie het issue met label develop-sync."
              exit 1
            fi
            if git push origin HEAD:develop; then
              echo "develop is bijgewerkt tot $(git rev-parse --short origin/main)."
              exit 0
            fi
            echo "Push mislukt (poging $attempt); opnieuw op de nieuwste develop."
            sleep $((attempt * 5))
          done
          echo "::error::develop kon niet worden bijgewerkt."
          exit 1
