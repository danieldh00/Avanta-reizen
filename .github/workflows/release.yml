name: Release

# Publiceert na elke release op main een getest image in GHCR:
#   ghcr.io/danieldh00/avanta-reizen:<versie>  en  :latest
# Volgorde: versie en releasenotes -> tests -> bouwen -> smoketest -> pushen.
# Versie: PR's brengen alleen een bestand changes/<naam>.md mee; job `prepare` geeft dat het volgende
# versienummer, werkt app/package.json en app/CHANGELOG.md bij, verwijdert de fragmenten en commit naar main met
# [skip ci], zodat er geen tweede run ontstaat (zie changes/README.md). De volgende jobs werken op die commit
# (`needs.prepare.outputs.ref`). Faalt een stap, dan komt er geen nieuw image en houdt :latest de vorige versie.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "changes/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/danieldh00/avanta-reizen

jobs:
  # Rechten: main is beschermd (PR verplicht). Zet daarom een token in het secret RELEASE_PUSH_TOKEN van een
  # beheerder met schrijfrechten op de repository, en zet de rol *Repository admin* als bypass in de ruleset van main
  # (Settings > Rules > Rulesets). Zonder dat secret valt deze job terug op GITHUB_TOKEN, en de push wordt dan door
  # de ruleset geweigerd.
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.bump.outputs.ref }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Versie en releasenotes bijwerken
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node tools/release-notes.js
            if git diff --quiet HEAD; then
              echo "Niets te bumpen."
              break
            fi
            version=$(jq -r .version app/package.json)
            git add -A changes app/package.json app/CHANGELOG.md
            git commit -m "Release $version [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            echo "Push mislukt (poging $attempt); opnieuw op de nieuwste main."
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version app/package.json)" >> "$GITHUB_OUTPUT"

  # Dezelfde tests als in ci.yml, maar op de releasecommit: alleen een groene versie wordt een image.
  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tests app (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Kwetsbaarheden in afhankelijkheden
        run: npm audit --omit=dev --audit-level=high

  # Bouwen, smoketest en pas daarna pushen. Bestaat het image voor deze versie al (bijv. een run zonder nieuwe
  # fragmenten of een handmatige herhaling), dan wordt niets overschreven.
  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REVISION: ${{ needs.prepare.outputs.ref }}
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bestaat deze versie al?
        id: exists
        run: |
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Geen versie ontvangen van prepare." >&2
            exit 1
          fi
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:$VERSION bestaat al; niets te doen."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.exists.outputs.skip == 'false'

      - name: Bouwen (lokaal laden voor de smoketest)
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: avanta:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoketest
        if: steps.exists.outputs.skip == 'false'
        run: |
          docker network create smokenet
          docker run -d --name smokedb --network smokenet -e POSTGRES_PASSWORD=smoke postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
          for i in $(seq 1 30); do docker exec smokedb pg_isready -U postgres && break; sleep 2; done
          docker run -d --name smoke --network smokenet -p 3400:3400 -e DATABASE_URL="postgres://postgres:smoke@smokedb:5432/postgres" avanta:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3400/api/health && exit 0; sleep 2; done
          docker logs smoke
          exit 1

      # Zelfde image-scan als in CI (ci.yml, job image): een release met een te verhelpen HIGH/CRITICAL gaat niet uit.
      - name: Image-scan (Trivy)
        if: steps.exists.outputs.skip == 'false'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/app:/src:ro" "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore \
            --exit-code 1 --no-progress avanta:smoke

      # Pas na een geslaagde smoketest naar GHCR: :latest wijst nooit naar een kapot image. Zelfde context, platform
      # en labels als de smoketest-build; alle lagen komen uit de gha-cache, dus dit is het geteste image.
      - name: Pushen naar GHCR
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: app
          platforms: linux/amd64
          push: true
          # SBOM en herkomst (provenance) als attestatie bij het image in GHCR.
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
