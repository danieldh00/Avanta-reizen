name: Versie

# Een PR verhoogt het versienummer niet zelf en past app/CHANGELOG.md niet aan: dat doet release.yml na het mergen
# vanuit het bestand changes/<naam>.md. Deze controle bewaakt dat.
# De naam van de job (version-must-increase) staat als verplichte controle in de ruleset van main;
# wijzig hem alleen samen met die ruleset.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version-must-increase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Releasenotes en versie controleren
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node tools/release-notes.js --pull-request "origin/${{ github.base_ref }}"
