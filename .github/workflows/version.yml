name: Versie

# Een PR verhoogt het versienummer niet zelf en past app/CHANGELOG.md niet aan: dat doet release.yml na het mergen
# vanuit het bestand changes/<naam>.md. Deze controle bewaakt dat.
# De naam van de job (version-must-increase) staat als verplichte controle in de rulesets van main en develop;
# wijzig hem alleen samen met die rulesets. Een PR naar develop (de integratiebranch van de ombouw naar Vue) volgt
# dezelfde regel: het fragment reist mee naar main en wordt daar een versie.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version-must-increase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Releasenotes en versie controleren
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node tools/release-notes.js --pull-request "origin/${{ github.base_ref }}"
