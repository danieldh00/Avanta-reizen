name: CI

# Zuinig draaien: een nieuwe push annuleert de lopende run, en een PR die geen code raakt (alleen docs of changes/)
# slaat de zware jobs over. Een overgeslagen job (`if`) telt voor de verplichte checks als geslaagd; een `paths:`-filter
# op workflowniveau zou de checks laten hangen en wordt daarom niet gebruikt.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bepaalt of de PR code raakt. Op main (push) en bij een mislukte vergelijking draait alles.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      screens: ${{ steps.scope.outputs.screens }}
    steps:
      # Alleen het script dat bestanden aan schermen koppelt; de rest van de repository is hier niet nodig.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/tools/design-check/changed-screens.js
          sparse-checkout-cone-mode: false
      - name: Raakt deze wijziging code, en welke schermen?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename') || { echo "code=true" >> "$GITHUB_OUTPUT"; echo "screens=/,/app/" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$files"
          # Schermen voor de design-controle (leeg = geen scherm geraakt, dan draait de job `design` niet). Lukt het
          # ophalen van de bestanden niet, dan hierboven een kleine vaste set, zodat de controle niet stil wegvalt.
          screens=$(printf '%s\n' "$files" | node app/tools/design-check/changed-screens.js)
          echo "screens=$screens" >> "$GITHUB_OUTPUT"
          echo "Schermen voor de design-controle: ${screens:-geen}"
          if echo "$files" | grep -Eq '^(app/|tools/|tests/|deploy/|docker-compose\.yml|Dockerfile|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Geen code gewijzigd (alleen docs of changes/): tests overgeslagen."
          fi

  # De naam `test` is een verplichte controle op main; wijzig hem alleen samen met de ruleset.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tests (hulpmiddelen)
        run: node --test "tests/*.test.js"
      - name: Releasenotes-fragmenten controleren
        run: node tools/release-notes.js --check
      - name: Afhankelijkheden app
        working-directory: app
        run: npm ci
      - name: PostgreSQL 17-client (pg_dump voor de back-uptests, zelfde versie als de database)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Lint (ESLint)
        working-directory: app
        run: npm run lint
      - name: Typecontrole op de JSDoc (bestanden met // @ts-check)
        working-directory: app
        run: npm run typecheck
      # Met dekkingsmeting en een drempel (regels, takken, functies; zie test:coverage in package.json). Onder de
      # drempel faalt de stap; verhoog de drempel als de dekking duurzaam hoger ligt, verlaag hem nooit stil.
      - name: Tests app (PostgreSQL) met dekkingsdrempel
        working-directory: app
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
        run: npm run test:coverage
      - name: Kwetsbaarheden in afhankelijkheden
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

  # Bouwt het image en controleert of het start (health-check tegen een echte PostgreSQL).
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Image bouwen
        run: docker build -t avanta:smoke app
      - name: Smoketest
        run: |
          docker network create smokenet
          docker run -d --name smokedb --network smokenet -e POSTGRES_PASSWORD=smoke postgres:17
          for i in $(seq 1 30); do docker exec smokedb pg_isready -U postgres && break; sleep 2; done
          docker run -d --name smoke --network smokenet -p 3400:3400 -e DATABASE_URL="postgres://postgres:smoke@smokedb:5432/postgres" avanta:smoke
          docker run --rm --entrypoint pg_dump avanta:smoke --version | grep -q ' 17\.'
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3400/api/health && exit 0; sleep 2; done
          docker logs smoke
          exit 1

  # Design-controle met Playwright, alleen op de schermen die deze PR raakt (`changed-screens.js`), op 1440 en 375 px.
  # Faalt bij bevindingen met ernst "hoog" (overloop, overlap, afgekapt, kapotte afbeelding); het rapport (.xlsx met
  # uitsneden) staat in het artefact `design-controle`. Draait niet op main en niet als de PR geen scherm raakt.
  design:
    needs: changes
    if: needs.changes.outputs.screens != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avanta_design
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Wegwerpdatabase en -app in deze job; de controles in guards.js accepteren alleen localhost en een databasenaam
      # met "design".
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/avanta_design
      DATA_DIR: /tmp/avanta-design/data
      PORT: "3400"
      SITE_URL: http://localhost:3400
      PASSWORD_BREACH_CHECK: "false"
      DESIGN_BASE_URL: http://localhost:3400
      SCREENS: ${{ needs.changes.outputs.screens }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Afhankelijkheden app
        run: npm ci
      - name: Playwright met Chromium (geen dependency van de app)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Wachtwoord voor de testaccounts (per run nieuw)
        run: |
          password=$(openssl rand -base64 24)
          echo "::add-mask::$password"
          echo "DESIGN_WACHTWOORD=$password" >> "$GITHUB_ENV"
      - name: App starten
        run: |
          mkdir -p "$DATA_DIR"
          nohup node src/server.js > /tmp/avanta-design/app.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3400/api/health > /dev/null && exit 0; sleep 2; done
          cat /tmp/avanta-design/app.log
          exit 1
      - name: Testgegevens
        # De uitvoer van de testdata bevat een tijdelijk wachtwoord; die blijft buiten het log.
        run: |
          node src/dev/seed/cli.js vullen --testomgeving > /dev/null
          node tools/design-check/seed.js
      - name: Design-controle op de gewijzigde schermen
        run: |
          echo "Schermen: $SCREENS"
          node tools/design-check/check.js --paths="$SCREENS" --out=/tmp/avanta-design/uitslag
      - name: Samenvatting en rapport
        if: always()
        run: |
          node tools/design-check/ci-summary.js /tmp/avanta-design/uitslag/results.json >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/avanta-design/uitslag/results.json ]; then
            node tools/design-check/report.js /tmp/avanta-design/uitslag/results.json /tmp/avanta-design/uitslag/design-controle.xlsx
          fi
      - name: Rapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-controle
          path: |
            /tmp/avanta-design/uitslag/design-controle.xlsx
            /tmp/avanta-design/uitslag/results.json
            /tmp/avanta-design/uitslag/screenshots/
          if-no-files-found: ignore
          retention-days: 7
