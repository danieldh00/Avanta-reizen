name: CI

# Zuinig draaien: een nieuwe push annuleert de lopende run, en een PR die geen code raakt (alleen docs of changes/)
# slaat de zware jobs over. Een overgeslagen job (`if`) telt voor de verplichte checks als geslaagd; een `paths:`-filter
# op workflowniveau zou de checks laten hangen en wordt daarom niet gebruikt.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bepaalt of de PR code raakt. Op main (push) en bij een mislukte vergelijking draait alles.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Raakt deze wijziging code?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename') || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$files"
          if echo "$files" | grep -Eq '^(app/|tools/|tests/|deploy/|docker-compose\.yml|Dockerfile|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Geen code gewijzigd (alleen docs of changes/): tests overgeslagen."
          fi

  # De naam `test` is een verplichte controle op main; wijzig hem alleen samen met de ruleset.
  # Breid deze job uit met de tests van de applicatie zodra de stack gekozen is.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (hulpmiddelen)
        run: node --test
      - name: Releasenotes-fragmenten controleren
        run: node tools/release-notes.js --check
