name: Security scans

# Vindt lekken en kwetsbaarheden vóór productie: geheimen in de code (gitleaks) en codeanalyse (CodeQL). Draait bij
# code-wijzigingen in een PR, op main en wekelijks (nieuwe kwetsbaarheden in bestaande code).
# Secret scanning en push protection van GitHub zelf staan in de repo-instellingen (Settings > Code security), niet hier.
# Een image-scan (Trivy) komt erbij zodra er een Dockerfile is (zie de AquaTech-workflow als voorbeeld).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bepaalt of de PR code raakt (zelfde regel als ci.yml); een overgeslagen job telt als geslaagd.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Raakt deze wijziging code?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename') || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if echo "$files" | grep -Eq '^(app/|tools/|deploy/|docker-compose\.yml|Dockerfile|\.github/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Geen code gewijzigd: beveiligingsscans overgeslagen."
          fi

  # Zoekt geheimen (sleutels, tokens, wachtwoorden) in de hele git-historie.
  secrets:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  # Statische codeanalyse van JavaScript en van de workflows zelf. Pas de talen aan zodra de stack gekozen is.
  codeql:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
